[build]
  # Não há build a rodar — é HTML/CSS/JS puro.
  # A Netlify só precisa publicar o conteúdo da pasta frontend.
  publish = "frontend"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# O HTML nunca deve prender referências de uma versão anterior.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

# Revalida scripts e estilos para não misturar versões do protocolo.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
